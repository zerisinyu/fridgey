<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Fridgey</title>
<meta name="description" content="A cute little tracker for what's in your fridge and pantry.">
<meta name="theme-color" content="#FFF9F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1D24" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fridgey">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF9F0; --card:#FFFFFF; --ink:#3D3A4B; --muted:#9A94A8; --line:#F1E9DD;
  --mint:#8FD3B6; --mint-d:#3FA37C; --mint-soft:#E2F6EC;
  --peach:#FF9F85; --peach-d:#E4704F; --peach-soft:#FFEDE5;
  --lav:#B7A4EE; --lav-d:#7E66CF; --lav-soft:#F1ECFE;
  --yel-soft:#FFF4C9; --yel-d:#B08A12;
  --red:#F07A7A; --red-d:#D24F4F; --red-soft:#FFE4E4;
  --chip:#F6F0E6; --shadow:0 2px 12px rgba(125,100,70,.08); --shadow-lg:0 -8px 40px rgba(80,60,40,.18);
  --kb:0px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1F1D24; --card:#2A2731; --ink:#F3EFF8; --muted:#9C96A8; --line:#37333F;
    --mint:#6FC4A0; --mint-d:#86D9B5; --mint-soft:#23382F;
    --peach:#F09076; --peach-d:#FFAE96; --peach-soft:#3E2C28;
    --lav:#A08BE0; --lav-d:#C3B3FA; --lav-soft:#312B45;
    --yel-soft:#3A3421; --yel-d:#E8C860;
    --red:#E07070; --red-d:#FF9C9C; --red-soft:#432A2D;
    --chip:#34303C; --shadow:0 2px 12px rgba(0,0,0,.25); --shadow-lg:0 -8px 40px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.35;
  min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea{border:0;outline:0;background:none}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 8px}
.top-row{display:flex;align-items:center;gap:10px}
.brand{font-weight:900;font-size:26px;letter-spacing:-.5px;margin:0;flex:1;display:flex;align-items:center;gap:8px}
.brand small{display:block;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0;margin-top:1px}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px}
.search{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;height:42px;box-shadow:var(--shadow)}
.search input{flex:1;height:100%;font-size:16px}
.search input::placeholder{color:var(--muted)}
.search .x{color:var(--muted);font-size:18px;width:28px;height:28px}

.wrap{padding:0 16px}
h2.sec{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:18px 4px 8px;display:flex;align-items:center;gap:6px}
h2.sec .n{background:var(--chip);border-radius:99px;padding:1px 7px;font-size:11px;letter-spacing:0}

/* eat soon */
.soon{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px;scrollbar-width:none;scroll-snap-type:x proximity}
.soon::-webkit-scrollbar,.tabs::-webkit-scrollbar,.chips.scroll::-webkit-scrollbar{display:none}
.soon-chip{flex:0 0 auto;scroll-snap-align:start;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:8px 12px 8px 10px;box-shadow:var(--shadow);max-width:210px}
.soon-chip .e{font-size:22px}
.soon-chip b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.soon-chip span{font-size:12px;font-weight:800}
.calm{font-size:14px;color:var(--muted);padding:4px 4px 0;font-weight:700}

/* location tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;margin:16px -16px 0;padding:2px 16px 4px;scrollbar-width:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:99px;background:var(--chip);font-weight:800;font-size:15px;color:var(--muted);transition:.15s}
.tab .c{font-size:12px;opacity:.8}
.tab.on{background:var(--ink);color:var(--bg)}

/* category cards and rows */
.cat{margin-top:14px}
.cat-h{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;margin:0 4px 6px}
.cat-h .n{color:var(--muted);font-size:13px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{position:relative;overflow:hidden}
.row + .row .fg{border-top:1px solid var(--line)}
.bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-weight:900;font-size:14px;color:#fff}
.bg .l{opacity:0}.bg .r{opacity:0}
.row.sw-r .bg{background:var(--mint-d)} .row.sw-r .bg .l{opacity:1}
.row.sw-l .bg{background:var(--red)} .row.sw-l .bg .r{opacity:1}
.row.arm .bg span{transform:scale(1.15)}
.bg span{transition:transform .15s}
.fg{position:relative;background:var(--card);display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;min-height:62px;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.fg.anim{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.emo{font-size:28px;width:36px;text-align:center;flex:0 0 auto}
.info{flex:1;min-width:0}
.name{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tag{font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.red{background:var(--red-soft);color:var(--red-d)}
.tag.peach{background:var(--peach-soft);color:var(--peach-d)}
.tag.yel{background:var(--yel-soft);color:var(--yel-d)}
.tag.lav{background:var(--lav-soft);color:var(--lav-d)}
.tag.memo{background:none;padding-left:0;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.qty{flex:0 0 auto;min-width:58px;height:40px;border-radius:14px;background:var(--mint-soft);color:var(--mint-d);font-weight:900;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;gap:3px;transition:transform .1s}
.qty:active{transform:scale(.92)}
.qty small{font-size:10px;font-weight:800;opacity:.85;line-height:1}
.lv{display:flex;gap:2px}
.lv i{width:7px;height:11px;border-radius:3px;background:currentColor;opacity:.22}
.lv i.on{opacity:1}
.qty.low{background:var(--peach-soft);color:var(--peach-d)}
.check{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:14px;color:#fff;font-weight:900}
.row.sel .check{background:var(--mint-d);border-color:var(--mint-d)}
.row.sel .fg{background:var(--mint-soft)}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96);background:var(--mint-soft)}100%{transform:none}}

.empty{text-align:center;padding:48px 20px;color:var(--muted);font-weight:700}
.empty .big{font-size:52px;margin-bottom:6px}
.hint{text-align:center;color:var(--muted);font-size:12.5px;font-weight:700;margin:22px 0 8px;opacity:.85}
.loc-label{font-size:11.5px;color:var(--muted);font-weight:800}

/* tab bar + fab */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:6px;padding:8px 16px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tb{flex:1;max-width:180px;height:50px;border-radius:16px;font-weight:800;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px}
.tb.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.tb .badge{background:var(--peach);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.fab{position:fixed;z-index:31;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:22px;background:var(--mint);color:#fff;
  font-size:34px;font-weight:700;box-shadow:0 8px 24px color-mix(in srgb,var(--mint-d) 45%,transparent);display:grid;place-items:center;transition:transform .12s}
.fab:active{transform:scale(.9)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:32;display:flex;align-items:center;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg)}
.selbar .cnt{flex:1;font-weight:900;padding-left:6px}
.selbar button{height:44px;padding:0 12px;border-radius:14px;background:color-mix(in srgb,var(--bg) 14%,transparent);font-weight:800;font-size:14px}
.selbar button.danger{background:var(--red);color:#fff}

/* toast */
.toast{position:fixed;left:12px;right:12px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:60;margin:0 auto;max-width:440px;background:var(--ink);color:var(--bg);border-radius:18px;
  padding:10px 10px 10px 16px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);
  transform:translateY(20px);opacity:0;pointer-events:none;transition:.22s}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{height:36px;padding:0 12px;border-radius:12px;background:color-mix(in srgb,var(--bg) 16%,transparent);font-weight:900;font-size:13.5px;white-space:nowrap}
.toast button.pri{background:var(--mint);color:#fff}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(40,30,40,.35);opacity:0;transition:opacity .22s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb);z-index:51;margin:0 auto;max-width:560px;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:var(--shadow-lg);
  max-height:calc(100dvh - var(--kb) - env(safe-area-inset-top) - 24px);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.grab{padding:10px 0 4px;display:grid;place-items:center;touch-action:none;flex:0 0 auto}
.grab i{width:40px;height:5px;border-radius:9px;background:var(--line)}
.sh-head{display:flex;align-items:center;gap:10px;padding:0 18px 8px;flex:0 0 auto}
.sh-head h3{flex:1;margin:0;font-size:20px;font-weight:900}
.sh-body{overflow-y:auto;padding:0 18px 12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-foot{display:flex;gap:8px;padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:0 0 auto}
.kb-open .sh-foot{padding-bottom:10px}
.btn{height:50px;border-radius:16px;padding:0 18px;font-weight:900;font-size:16px;background:var(--chip);display:flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--mint-d);color:#fff;flex:1}
.btn.ghost{background:var(--card);box-shadow:var(--shadow)}
.btn.danger{color:var(--red-d);background:var(--red-soft)}
.btn.done{background:var(--mint-soft);color:var(--mint-d)}
.btn.sm{height:40px;font-size:14px;padding:0 14px;border-radius:13px}

/* form */
.name-row{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:18px;padding:6px;box-shadow:var(--shadow)}
.emo-btn{width:52px;height:52px;border-radius:14px;background:var(--chip);font-size:30px;flex:0 0 auto}
.name-row input{flex:1;height:52px;font-size:19px;font-weight:800;min-width:0}
.name-row input::placeholder{color:var(--muted);font-weight:700}
.lbl{font-size:12.5px;font-weight:900;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:16px 2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -18px;padding:2px 18px;scrollbar-width:none}
.chip{flex:0 0 auto;height:40px;padding:0 13px;border-radius:13px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:14.5px;display:inline-flex;align-items:center;gap:5px;position:relative;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.chip.soft{background:var(--chip);box-shadow:none}
.chip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.sugg{display:flex;gap:7px;overflow-x:auto;margin:10px -18px 0;padding:2px 18px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg .chip{height:36px;font-size:14px;background:var(--lav-soft);color:var(--lav-d);box-shadow:none}
.sugg .t{font-size:11.5px;font-weight:900;color:var(--muted);align-self:center;white-space:nowrap}
.warn{margin-top:10px;font-size:13.5px;font-weight:800;color:var(--peach-d);background:var(--peach-soft);border-radius:12px;padding:8px 12px}
.seg{display:flex;background:var(--chip);border-radius:13px;padding:3px;width:max-content}
.seg button{height:34px;padding:0 14px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.qty-ed{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.step{display:flex;align-items:center;background:var(--card);border-radius:15px;box-shadow:var(--shadow)}
.step button{width:48px;height:48px;font-size:24px;font-weight:800;color:var(--mint-d)}
.step output{min-width:34px;text-align:center;font-weight:900;font-size:20px}
.unit{height:48px;width:110px;background:var(--card);border-radius:15px;box-shadow:var(--shadow);padding:0 14px;font-weight:800}
.unit::placeholder{color:var(--muted)}
.levels{display:flex;gap:6px;margin-top:10px;width:100%}
.levels button{flex:1;height:58px;border-radius:15px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--muted)}
.levels button .lv i{width:6px;height:12px}
.levels button.on{background:var(--mint-soft);color:var(--mint-d);box-shadow:inset 0 0 0 2px var(--mint)}
.exp-now{font-size:13.5px;font-weight:800;color:var(--muted);margin-top:8px;padding-left:2px}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tog{height:44px;padding:0 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.tog.on.op{background:var(--lav-soft);color:var(--lav-d);box-shadow:inset 0 0 0 2px var(--lav)}
.tog.on.us{background:var(--peach-soft);color:var(--peach-d);box-shadow:inset 0 0 0 2px var(--peach)}
.note{width:100%;min-height:46px;background:var(--card);border-radius:15px;box-shadow:var(--shadow);padding:12px 14px;font-weight:700;resize:none}
.note::placeholder{color:var(--muted)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:10px;background:var(--card);border-radius:16px;padding:8px;box-shadow:var(--shadow)}
.emoji-grid button{height:40px;font-size:24px;border-radius:10px}
.emoji-grid button:active{background:var(--chip)}

/* move sheet */
.big-opts{display:grid;gap:8px}
.big-opt{height:60px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:0 18px;font-weight:900;font-size:17px;text-align:left}
.big-opt .e{font-size:26px}
.big-opt.on{box-shadow:inset 0 0 0 2px var(--mint);background:var(--mint-soft)}
.big-opt small{margin-left:auto;color:var(--muted);font-weight:800;font-size:13px}

/* shopping */
.add-line{display:flex;gap:8px;margin-top:12px}
.add-line .search{margin-top:0;flex:1}
.add-line .btn{height:42px;border-radius:14px;background:var(--mint-d);color:#fff;padding:0 16px}
.shop-row{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 14px;min-height:58px}
.shop-row + .shop-row{border-top:1px solid var(--line)}
.box{width:28px;height:28px;border-radius:10px;border:2.5px solid var(--line);display:grid;place-items:center;color:#fff;font-weight:900;flex:0 0 auto;font-size:15px}
.shop-row.done .box{background:var(--mint-d);border-color:var(--mint-d)}
.shop-row.done .name{text-decoration:line-through;color:var(--muted)}
.shop-row .x{width:36px;height:36px;border-radius:12px;color:var(--muted);font-size:18px}
.have{font-size:12px;font-weight:800;color:var(--mint-d)}
.stock-it{height:34px;padding:0 11px;border-radius:11px;background:var(--mint-soft);color:var(--mint-d);font-weight:900;font-size:13px;white-space:nowrap}
.link{color:var(--muted);font-weight:800;font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* settings */
.set-row{display:flex;align-items:center;gap:8px;padding:6px 8px}
.set-row + .set-row{border-top:1px solid var(--line)}
.set-row .e{width:44px;height:40px;text-align:center;font-size:22px;background:var(--chip);border-radius:11px}
.set-row .t{flex:1;height:40px;font-weight:800;min-width:0;padding:0 6px}
.set-row .mini{width:34px;height:36px;border-radius:10px;color:var(--muted);font-size:15px;font-weight:900}
.set-row .mini:disabled{opacity:.25}
.stack{display:grid;gap:8px}
.muted{color:var(--muted);font-size:13px;font-weight:700}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <h1 class="brand"><span>🧊</span><span>Fridgey<small id="sub"></small></span></h1>
    <button class="icon-btn" id="btnSettings" aria-label="Settings">⚙️</button>
  </div>
  <div class="search" id="searchBox">
    <span>🔍</span>
    <input id="q" type="search" placeholder="Do I have…?" autocomplete="off" enterkeyhint="search">
    <button class="x hidden" id="qClear" aria-label="Clear search">✕</button>
  </div>
  <div class="add-line hidden" id="shopAdd">
    <div class="search"><span>🛒</span><input id="shopIn" placeholder="Add to shopping list…" autocomplete="off" enterkeyhint="done"></div>
    <button class="btn" id="shopBtn">Add</button>
  </div>
</header>

<main class="wrap" id="stockView"></main>
<main class="wrap hidden" id="shopView"></main>

<button class="fab" id="fab" aria-label="Add food">+</button>
<nav class="tabbar" id="tabbar">
  <button class="tb on" data-view="stock">🧊 Stock</button>
  <button class="tb" data-view="shop">🛒 Shopping <span class="badge hidden" id="shopBadge"></span></button>
</nav>
<div class="selbar hidden" id="selbar">
  <span class="cnt" id="selCnt"></span>
  <button data-sel="move">Move</button>
  <button data-sel="open">Opened</button>
  <button data-sel="del" class="danger">Delete</button>
  <button data-sel="x" aria-label="Cancel">✕</button>
</div>
<div class="toast" id="toast"><span class="msg"></span></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key = s => String(s || '').trim().toLowerCase();

let gest = null, suppressClick = false;
const stock = $('#stockView');
stock.addEventListener('pointerdown', e => {
  const fg = e.target.closest('.fg'); if (!fg || e.button > 0) return;
  const row = fg.parentElement;
  gest = { fg, row, id: row.dataset.id, x: e.clientX, y: e.clientY, dx: 0, mode: null, pid: e.pointerId };
  fg.classList.remove('anim');
  gest.lp = setTimeout(() => {
    if (!gest || gest.mode) return;
    gest.mode = 'lp'; suppressClick = true;
    if (!sel) sel = new Set(); sel.add(gest.id); navigator.vibrate?.(15); renderStock();
  }, 480);
});
stock.addEventListener('pointermove', e => {
  if (!gest || e.pointerId !== gest.pid) return;
  const dx = e.clientX - gest.x, dy = e.clientY - gest.y;
  if (!gest.mode) {
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2 && !sel) { gest.mode = 'swipe'; clearTimeout(gest.lp); try { gest.fg.setPointerCapture(e.pointerId); } catch {} }
    else if (Math.abs(dy) > 10 || Math.abs(dx) > 10) { clearTimeout(gest.lp); gest.mode = 'scroll'; }
  }
  if (gest.mode === 'swipe') {
    const w = gest.row.offsetWidth, lim = w * .6;
    let x = Math.abs(dx) > lim ? Math.sign(dx) * (lim + (Math.abs(dx) - lim) * .3) : dx;
    gest.dx = dx; gest.fg.style.transform = `translateX(${x}px)`;
    gest.row.classList.toggle('sw-r', dx > 0); gest.row.classList.toggle('sw-l', dx < 0);
    gest.row.classList.toggle('arm', Math.abs(dx) > 90);
  }
});
function endGesture(e) {

      g.fg.style.transform = `translateX(${Math.sign(g.dx) * 110}%)`;
      setTimeout(() => g.dx > 0 ? finishItems([g.id]) : deleteItems([g.id]), 170);
    } else { g.fg.style.transform = ''; setTimeout(() => g.row.classList.remove('sw-l', 'sw-r', 'arm'), 220); }

/* ---------- sheet ---------- */
let curSheet = null;
function openSheet(title, bodyHTML, footHTML = '', headExtra = '') {
  closeSheet(true);
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const el = document.createElement('div'); el.className = 'sheet'; el.setAttribute('role', 'dialog');
  el.innerHTML = `<div class="grab"><i></i></div><div class="sh-head"><h3>${title}</h3>${headExtra}</div><div class="sh-body">${bodyHTML}</div>${footHTML ? `<div class="sh-foot">${footHTML}</div>` : ''}`;
  document.body.append(scrim, el);
  scrim.onclick = () => closeSheet();
  requestAnimationFrame(() => { scrim.classList.add('show'); el.classList.add('show'); });
  // drag handle to close
  const grab = el.querySelector('.grab'); let y0 = null;
  grab.onpointerdown = e => { y0 = e.clientY; grab.setPointerCapture(e.pointerId); el.style.transition = 'none'; };
  grab.onpointermove = e => { if (y0 === null) return; const d = Math.max(0, e.clientY - y0); el.style.transform = `translateY(${d}px)`; };
  grab.onpointerup = e => { if (y0 === null) return; const d = e.clientY - y0; y0 = null; el.style.transition = ''; el.style.transform = ''; if (d > 80) closeSheet(); };
  curSheet = { el, scrim, body: el.querySelector('.sh-body'), foot: el.querySelector('.sh-foot'), head: el.querySelector('.sh-head'), onClose: null };
  document.body.style.overflow = 'hidden';

}
function closeSheet(instant) {

  document.activeElement?.blur?.();
  onClose?.();
  document.body.style.overflow = '';

  setTimeout(() => { el.remove(); scrim.remove(); }, 280);
}

if (window.visualViewport) {
  const vv = visualViewport;
  const fit = () => { const kb = Math.max(0, innerHeight - vv.height - vv.offsetTop); document.documentElement.style.setProperty('--kb', kb + 'px'); document.body.classList.toggle('kb-open', kb > 80); };

  const paintS = () => {
    const list = (arr, kind) => `<div class="card">${arr.map((x, i) => {
      const used = state.items.some(it => (kind === 'loc' ? it.locationId : it.categoryId) === x.id);
      return `<div class="set-row" data-kind="${kind}" data-id="${x.id}"><input class="e" value="${esc(x.emoji)}" data-field="emoji" aria-label="Emoji"><input class="t" value="${esc(x.name)}" data-field="name" aria-label="Name">
        <button class="mini" data-mv="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move up">↑</button><button class="mini" data-mv="1" ${i === arr.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button>
        <button class="mini" data-rm ${used || arr.length < 2 ? 'disabled' : ''} aria-label="Remove" title="${used ? 'Move its items out first' : ''}">✕</button></div>`; }).join('')}</div>`;
    sh.body.innerHTML = `
      <div class="lbl">Places</div>${list(state.locations, 'loc')}
      <button class="btn sm ghost" style="margin-top:8px" data-s="addloc">+ Add place</button>
      <div class="lbl">Types</div>${list(state.categories, 'cat')}
      <button class="btn sm ghost" style="margin-top:8px" data-s="addcat">+ Add type</button>
      <p class="muted">Places or types still holding food can’t be removed. Move the items first.</p>
      <div class="lbl">Backup</div>
      <p class="muted" style="margin-top:0">Everything lives only on this device. Export now and then so you never lose it.</p>
      <div class="stack"><button class="btn ghost" data-s="export">⬇️ Export backup (.json)</button><button class="btn ghost" data-s="import">⬆️ Import backup</button><button class="btn ghost" data-s="copy">📋 Copy list as text</button></div>
      <div class="lbl">Start over</div>
      <div class="stack"><button class="btn danger" data-s="wipe">Erase everything</button></div>
      <p class="muted" style="text-align:center;margin-top:18px">Fridgey · made with 🥬</p>`;
  };
  paintS();
  sh.body.addEventListener('input', e => {
    const inp = e.target.closest('[data-field]'); if (!inp) return;
    const r = inp.closest('.set-row'), arr = r.dataset.kind === 'loc' ? state.locations : state.categories;
    const x = arr.find(y => y.id === r.dataset.id); if (x) { x[inp.dataset.field] = inp.value; save(); renderAll(); }
  });
  sh.body.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const r = b.closest('.set-row');
    if (r) {
      const arr = r.dataset.kind === 'loc' ? state.locations : state.categories, i = arr.findIndex(y => y.id === r.dataset.id);
      if (b.dataset.mv) { const j = i + +b.dataset.mv; [arr[i], arr[j]] = [arr[j], arr[i]]; }
      if (b.hasAttribute('data-rm')) arr.splice(i, 1);
      save(); renderAll(); return paintS();
    }
    const a = b.dataset.s;
    if (a === 'addloc') { state.locations.push({ id: uid(), emoji: '📦', name: 'New place' }); save(); renderAll(); paintS(); $$('.set-row[data-kind="loc"] .t', sh.body).pop().select(); }
    if (a === 'addcat') { state.categories.push({ id: uid(), emoji: '🍽️', name: 'New type' }); save(); renderAll(); paintS(); $$('.set-row[data-kind="cat"] .t', sh.body).pop().select(); }
    if (a === 'export') exportData();
    if (a === 'import') $('#importFile').click();
    if (a === 'copy') copyText();
    if (a === 'wipe' && confirm('Erase all food, lists and history on this device?')) { const bf = snap(); const fresh = seed(); state = { ...fresh, items: [], history: {}, ui: { loc: fresh.locations[0].id, lastCat: {} } }; save(); renderAll(); closeSheet(); toast('Erased. Fresh start ✨', [{ label: 'Undo', run: () => restore(bf) }]); }
  });
  sh.foot.onclick = () => closeSheet();
}
$('#btnSettings').onclick = openSettings;
async function exportData() {
  const name = `fridgey-${today()}.json`, json = JSON.stringify(state, null, 1);
  const file = new File([json], name, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) { try { await navigator.share({ files: [file], title: 'Fridgey backup' }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('⬇️ Backup saved');
}
$('#importFile').onchange = async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const data = normalize(JSON.parse(await file.text()));
    if (!confirm(`Replace what's here with this backup (${data.items.length} items)?`)) return;
    const bf = snap(); state = data; save(); closeSheet(); renderAll();
    toast(`⬆️ Imported ${data.items.length} items`, [{ label: 'Undo', run: () => restore(bf) }]);
  } catch { toast('😕 That file doesn’t look like a Fridgey backup'); }
};
async function copyText() {
  let out = '';
  for (const l of state.locations) {
    const here = state.items.filter(i => i.locationId === l.id); if (!here.length) continue;
    out += `${l.emoji} ${l.name}\n`;
    for (const c of state.categories) {
      const its = here.filter(i => i.categoryId === c.id); if (!its.length) continue;
      out += `\n${c.emoji} ${c.name}\n` + its.map(i => `• ${i.name}${i.qty.mode === 'count' ? (i.qty.count > 1 || i.qty.unit ? ` ×${i.qty.count}${i.qty.unit ? ' ' + i.qty.unit : ''}` : '') : i.qty.level < 4 ? ` (${LEVELS[i.qty.level].toLowerCase()})` : ''}${i.opened ? ' · opened' : ''}${i.expiry ? ' · exp ' + shortDate(i.expiry) : ''}`).join('\n') + '\n';
    }
    out += '\n';
  }
  try { await navigator.clipboard.writeText(out.trim()); toast('📋 Copied!'); } catch { toast('Could not copy'); }
}

/* ---------- boot ---------- */
renderAll();
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderAll(); }); // refresh day counts when reopened
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
